name: Daily Message Push

on:
  # 允许手动触发，方便测试
  workflow_dispatch:
  
  # 定时触发
  schedule:
    # 北京时间 7:00 (UTC 23:00 前一天)
    - cron: '0 23 * * *'
    # 北京时间 9:20 (UTC 1:20)
    - cron: '20 1 * * *'
    # 北京时间 18:00 (UTC 10:00)
    - cron: '0 10 * * *'

jobs:
  push_message:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 核心逻辑：根据 UTC 时间判断执行哪个推送任务
    # 这里的 ${{ github.event.schedule }} 会获取触发 cron 的表达式
    - name: Run Morning Push (UTC 23:00)
      if: github.event.schedule == '0 23 * * *'
      env:
        QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
        LOCATION_ID: ${{ secrets.LOCATION_ID }}
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      run: python main.py morning

    - name: Run AM Checkin Push (UTC 01:20)
      if: github.event.schedule == '20 1 * * *'
      env:
        QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
        LOCATION_ID: ${{ secrets.LOCATION_ID }}
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      run: python main.py work_am

    - name: Run PM Checkin Push (UTC 10:00)
      if: github.event.schedule == '0 10 * * *'
      env:
        QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
        LOCATION_ID: ${{ secrets.LOCATION_ID }}
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      run: python main.py work_pm

